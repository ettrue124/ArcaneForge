[package]
name = "arcane_switch"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
# idevice changes API on every 0.1.x release; keep the version pinned.
idevice = { version = "=0.1.68", default-features = false, features = ["aws-lc", "house_arrest", "tcp"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = "z"
